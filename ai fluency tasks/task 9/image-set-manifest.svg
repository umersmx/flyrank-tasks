<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600">
  <defs>
    <style>
      .bg { fill: #FAFAFA; }
      .card-keep { fill: #FFFFFF; stroke: #059669; stroke-width: 1.5; rx: 8px; }
      .card-reject { fill: #FFF1F2; stroke: #F43F5E; stroke-width: 1.5; rx: 8px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Geist', 'Inter', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 12px; font-weight: 400; fill: #64748B; }
      .badge-green { font-family: sans-serif; font-size: 10px; font-weight: 700; fill: #059669; }
      .badge-red { font-family: sans-serif; font-size: 10px; font-weight: 700; fill: #E11D48; }
      .item-title { font-family: sans-serif; font-size: 12px; font-weight: 700; fill: #0F172A; }
      .item-desc { font-family: sans-serif; font-size: 10.5px; fill: #475569; }
      .reject-reason { font-family: sans-serif; font-size: 10px; fill: #9F1239; font-style: italic; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="920" height="600" fill="#FAFAFA" />
  <rect x="20" y="20" width="880" height="560" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(45, 55)">
    <text x="0" y="0" font-family="sans-serif" font-size="11" font-weight="700" fill="#059669" letter-spacing="0.5px">FL-03 IMAGE CURATION &amp; DISCERNMENT AUDIT</text>
    <text x="0" y="24" class="title">Visual Evidence Strategy: The Keepers vs. Ruthless AI Rejections</text>
    <text x="0" y="44" class="subtitle">"AI can generate a hundred images in minutes. The real skill is knowing when a real screenshot beats anything generated."</text>
  </g>

  <!-- LEFT COLUMN: THE KEEPERS (GREEN) -->
  <g transform="translate(45, 130)">
    <rect x="0" y="0" width="415" height="420" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" />
    <text x="20" y="30" class="badge-green">✔ THE KEEPERS (APPROVED ASSET SET)</text>
    <text x="20" y="48" font-family="sans-serif" font-size="11" fill="#166534">Authentic software captures + real photography + vector tokens</text>

    <!-- Keeper Item 1 -->
    <rect x="20" y="65" width="375" height="70" class="card-keep" />
    <text x="35" y="88" class="item-title">1. Real DevTools Performance Capture</text>
    <text x="35" y="105" class="item-desc">• Streaming CLS side-by-side: Unbounded vs. Skeleton lock.</text>
    <text x="35" y="120" class="badge-green">Standard: Real running DOM measurements, zero synthetic UI.</text>

    <!-- Keeper Item 2 -->
    <rect x="20" y="145" width="375" height="70" class="card-keep" />
    <text x="35" y="168" class="item-title">2. Real Vitest Terminal Test Suite</text>
    <text x="35" y="185" class="item-desc">• 100% pass on Zod schema boundaries and mutex click locks.</text>
    <text x="35" y="200" class="badge-green">Standard: Actual command line execution with timing benchmarks.</text>

    <!-- Keeper Item 3 -->
    <rect x="20" y="225" width="375" height="70" class="card-keep" />
    <text x="35" y="248" class="item-title">3. Authentic Natural-Light Portrait</text>
    <text x="35" y="265" class="item-desc">• Real photograph of Muhammad Umer at workstation.</text>
    <text x="35" y="280" class="badge-green">Standard: Genuine human colleague, zero AI avatar pretense.</text>

    <!-- Keeper Item 4 -->
    <rect x="20" y="305" width="375" height="70" class="card-keep" />
    <text x="35" y="328" class="item-title">4. Minimalist Vector Identity Assets</text>
    <text x="35" y="345" class="item-desc">• Scalable logo.svg, favicon.svg, and architecture diagram.</text>
    <text x="35" y="360" class="badge-green">Standard: Mathematically consistent, lightweight SVG geometry.</text>
  </g>

  <!-- RIGHT COLUMN: THE REJECTIONS (RED) -->
  <g transform="translate(480, 130)">
    <rect x="0" y="0" width="415" height="420" rx="10" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.2" />
    <text x="20" y="30" class="badge-red">✖ RUTHLESS REJECTIONS (DISCERNMENT AUDIT)</text>
    <text x="20" y="48" font-family="sans-serif" font-size="11" fill="#9F1239">Generated AI concepts analyzed, critiqued, and binned</text>

    <!-- Rejection 1 -->
    <rect x="20" y="65" width="375" height="70" class="card-reject" />
    <text x="35" y="88" class="item-title">1. Abstract 3D Neural Glow Wallpaper</text>
    <text x="35" y="105" class="item-desc">• Neon cyan fibers &amp; glass orbs in dark void.</text>
    <text x="35" y="122" class="reject-reason">Why binned: Upstages the work; evokes generic crypto slop.</text>

    <!-- Rejection 2 -->
    <rect x="20" y="145" width="375" height="70" class="card-reject" />
    <text x="35" y="168" class="item-title">2. Floating Isometric 3D Dashboard</text>
    <text x="35" y="185" class="item-desc">• Synthetic floating card with fake buttons and charts.</text>
    <text x="35" y="122" class="reject-reason" y="202">Why binned: Fraudulent proof; conceals real code capability.</text>

    <!-- Rejection 3 -->
    <rect x="20" y="225" width="375" height="70" class="card-reject" />
    <text x="35" y="248" class="item-title">3. Cyberpunk Coder AI Avatar</text>
    <text x="35" y="265" class="item-desc">• Waxy digital face bathed in blue screen light.</text>
    <text x="35" y="122" class="reject-reason" y="282">Why binned: Uncanny valley destroys professional trust.</text>

    <!-- Rejection 4 -->
    <rect x="20" y="305" width="375" height="70" class="card-reject" />
    <text x="35" y="328" class="item-title">4. Bulbous Skeuomorphic 3D Badge</text>
    <text x="35" y="345" class="item-desc">• Plastic glossy checkmark shield with drop shadow.</text>
    <text x="35" y="122" class="reject-reason" y="362">Why binned: Clashes horribly with modern Swiss Geist type.</text>
  </g>
</svg>
