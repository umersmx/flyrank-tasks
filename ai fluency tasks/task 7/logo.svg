<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 44" width="240" height="44">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Monogram Badge -->
  <g transform="translate(2, 4)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="url(#logoBg)" stroke="#334155" stroke-width="1.2" />
    <text x="7" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Geist', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#FAFAFA" letter-spacing="-0.5">MU</text>
    <circle cx="28" cy="23" r="2.5" fill="#059669" />
  </g>

  <!-- Wordmark & Sub-Title -->
  <g transform="translate(48, 8)">
    <!-- Primary Name -->
    <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Geist', 'Inter', sans-serif" font-size="15" font-weight="700" fill="#0F172A" letter-spacing="-0.3">
      Muhammad Umer
    </text>
    <!-- Subtitle / Track -->
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" fill="#64748B" letter-spacing="0.2">
      Frontend AI Engineer
    </text>
  </g>
</svg>
