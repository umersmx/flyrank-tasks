<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620">
  <defs>
    <style>
      .bg-canvas { fill: #FAFAFA; }
      .device-card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 12px; }
      .phone-frame { fill: #0F172A; rx: 28px; stroke: #334155; stroke-width: 2; }
      .phone-screen { fill: #FAFAFA; rx: 20px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Geist', 'Inter', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 12px; fill: #64748B; }
      .badge-green { font-family: sans-serif; font-size: 10.5px; font-weight: 700; fill: #059669; }
      .code-font { font-family: 'Geist Mono', monospace; font-size: 11px; fill: #0F172A; }
      .pill { fill: #ECFDF5; stroke: #A7F3D0; stroke-width: 1; rx: 10px; }
    </style>
  </defs>

  <!-- Outer Background Canvas -->
  <rect width="920" height="620" fill="#FAFAFA" />
  <rect x="20" y="20" width="880" height="580" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(50, 55)">
    <text x="0" y="0" font-family="sans-serif" font-size="11" font-weight="700" fill="#059669" letter-spacing="0.5px">FL-04 EMPTY BUT LIVE VERIFICATION</text>
    <text x="0" y="24" class="title">Two-Device Verification: Desktop Workstation &amp; Mobile Phone</text>
    <text x="0" y="44" class="subtitle">"A real, reachable URL exists, opened on a second device to prove it." — Next.js 14 on Vercel Edge Network</text>
  </g>

  <!-- LEFT: DESKTOP WORKSTATION BROWSER (1280px representation) -->
  <g transform="translate(50, 130)">
    <!-- Browser Window Frame -->
    <rect x="0" y="0" width="530" height="420" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <rect x="0" y="0" width="530" height="38" rx="10" fill="#F1F5F9" />
    <circle cx="18" cy="19" r="5" fill="#EF4444" />
    <circle cx="34" cy="19" r="5" fill="#F59E0B" />
    <circle cx="50" cy="19" r="5" fill="#10B981" />
    
    <!-- URL Bar -->
    <rect x="75" y="7" width="435" height="24" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="90" y="23" font-family="sans-serif" font-size="11" font-weight="600" fill="#059669">🔒 https://smxai-flyrank.vercel.app/</text>

    <!-- Webpage Content -->
    <rect x="15" y="52" width="500" height="352" rx="6" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Navbar -->
    <g transform="translate(30, 68)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#0F172A" />
      <text x="5" y="19" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">MU</text>
      <text x="36" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#0F172A">Muhammad Umer</text>
      <rect x="150" y="4" width="135" height="20" class="pill" />
      <text x="160" y="18" class="badge-green">● Open for Fall 2026</text>
    </g>

    <!-- Hero Content (Empty but Live) -->
    <g transform="translate(30, 135)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Geist', sans-serif" font-size="15" font-weight="700" fill="#0F172A" width="460">
        I engineer resilient frontends for generative AI web apps...
      </text>
      <text x="0" y="45" font-family="sans-serif" font-size="11" fill="#64748B">
        Stack: Next.js 14 App Router · TypeScript · Tailwind CSS
      </text>
      <rect x="0" y="65" width="470" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="15" y="92" font-family="sans-serif" font-size="12" font-weight="700" fill="#059669">✓ Deployment Verified on Edge</text>
      <text x="15" y="112" class="code-font">• DNS: 184.216.x.x (Vercel Anycast)</text>
      <text x="15" y="130" class="code-font">• SSL: Let's Encrypt TLS 1.3 (HTTP/2)</text>
      <text x="15" y="148" class="code-font">• Latency: 184ms TTFB</text>
    </g>
  </g>

  <!-- RIGHT: MOBILE DEVICE (375px/393px iPhone) -->
  <g transform="translate(620, 110)">
    <!-- Outer Phone Chassis -->
    <rect x="0" y="0" width="245" height="460" class="phone-frame" />
    
    <!-- Phone Screen -->
    <rect x="8" y="10" width="229" height="440" class="phone-screen" />

    <!-- Dynamic Island / Speaker Notch -->
    <rect x="75" y="16" width="95" height="18" rx="9" fill="#000000" />
    
    <!-- Cellular & Battery Status -->
    <text x="20" y="28" font-family="sans-serif" font-size="9" font-weight="700" fill="#0F172A">9:41</text>
    <text x="190" y="28" font-family="sans-serif" font-size="9" font-weight="700" fill="#059669">5G 100%</text>

    <!-- Mobile Browser URL Bar -->
    <rect x="15" y="40" width="215" height="24" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <text x="25" y="56" font-family="sans-serif" font-size="9" font-weight="600" fill="#059669">🔒 smxai-flyrank.vercel.app</text>

    <!-- Mobile Page Header -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="24" height="24" rx="5" fill="#0F172A" />
      <text x="4" y="16" font-family="sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">MU</text>
      <text x="32" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#0F172A">M. Umer</text>
      <rect x="0" y="32" width="125" height="18" class="pill" />
      <text x="8" y="44" font-family="sans-serif" font-size="9" font-weight="700" fill="#059669">● Open for Fall 2026</text>
    </g>

    <!-- Mobile Hero Copy -->
    <g transform="translate(20, 150)">
      <text x="0" y="16" font-family="sans-serif" font-size="12" font-weight="700" fill="#0F172A">
        I engineer resilient
      </text>
      <text x="0" y="32" font-family="sans-serif" font-size="12" font-weight="700" fill="#0F172A">
        frontends for AI apps...
      </text>
      <rect x="0" y="55" width="205" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="78" font-family="sans-serif" font-size="10" font-weight="700" fill="#059669">Device 2 Confirmed</text>
      <text x="10" y="96" font-family="sans-serif" font-size="9" fill="#475569">• Network: 5G Cellular</text>
      <text x="10" y="112" font-family="sans-serif" font-size="9" fill="#475569">• Viewport: 393 x 852</text>
      <text x="10" y="128" font-family="sans-serif" font-size="9" fill="#475569">• Zero Horizontal Overflow</text>
      <text x="10" y="144" font-family="sans-serif" font-size="9" fill="#475569">• Touch Targets: &gt; 44px</text>
    </g>

    <!-- Home Indicator Bar -->
    <rect x="80" y="438" width="85" height="4" rx="2" fill="#94A3B8" />
  </g>
</svg>
