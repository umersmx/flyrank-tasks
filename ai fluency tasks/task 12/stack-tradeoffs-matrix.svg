<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="940" height="600">
  <defs>
    <style>
      .canvas-bg { fill: #FAFAFA; }
      .card-default { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; rx: 10px; }
      .card-selected { fill: #FFFFFF; stroke: #059669; stroke-width: 2.2; rx: 10px; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Geist', 'Inter', sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
      .header-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 12px; fill: #64748B; }
      .road-title { font-family: -apple-system, BlinkMacSystemFont, 'Geist', sans-serif; font-size: 14px; font-weight: 700; fill: #0F172A; }
      .road-tag { font-family: sans-serif; font-size: 10px; font-weight: 700; }
      .text-label { font-family: sans-serif; font-size: 10px; font-weight: 700; fill: #64748B; text-transform: uppercase; letter-spacing: 0.5px; }
      .text-body { font-family: sans-serif; font-size: 11px; fill: #334155; line-height: 1.4; }
      .text-alert { font-family: sans-serif; font-size: 11px; fill: #E11D48; font-weight: 600; }
      .text-winner { font-family: sans-serif; font-size: 11px; fill: #059669; font-weight: 600; }
    </style>
  </defs>

  <!-- Outer Canvas Container -->
  <rect width="940" height="600" fill="#FAFAFA" />
  <rect x="20" y="20" width="900" height="560" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Diagram Header -->
  <g transform="translate(50, 55)">
    <text x="0" y="0" font-family="sans-serif" font-size="11" font-weight="700" fill="#059669" letter-spacing="0.5px">FL-04 THREE ROADS ARCHITECTURAL EVALUATION</text>
    <text x="0" y="24" class="header-title">Choosing How to Build: Three Roads Grounded in Real Constraints</text>
    <text x="0" y="44" class="header-subtitle">"Do not bring a bulldozer to plant a flower. The best stack is the smallest one that shows your work and that you can maintain."</text>
  </g>

  <!-- ROAD 1: THE SIMPLEST -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="265" height="420" class="card-default" />
    <rect x="15" y="15" width="115" height="20" rx="4" fill="#F1F5F9" />
    <text x="22" y="29" class="road-tag" fill="#475569">ROAD 1: SIMPLEST</text>
    
    <text x="15" y="58" class="road-title">Vanilla HTML5 + Tailwind</text>
    <text x="15" y="74" class="text-body">Single static index.html with CDN</text>

    <!-- Build -->
    <text x="15" y="105" class="text-label">How You Build:</text>
    <text x="15" y="122" class="text-body">• Raw semantic HTML5 + CSS</text>
    <text x="15" y="138" class="text-body">• Zero bundlers or package.json</text>

    <!-- Host -->
    <text x="15" y="168" class="text-label">Where You Host (Free):</text>
    <text x="15" y="185" class="text-body">• GitHub Pages / Cloudflare Pages</text>

    <!-- Backend -->
    <text x="15" y="215" class="text-label">Backend Needed?</text>
    <text x="15" y="232" class="text-body">• None. 100% static client.</text>

    <!-- Real Trade-off -->
    <text x="15" y="262" class="text-label">The Real Trade-off:</text>
    <text x="15" y="280" class="text-alert">✖ Contradicts Core Proof</text>
    <text x="15" y="296" class="text-body">Cannot showcase React 19 state machines, Zod types, or custom streaming hooks natively.</text>

    <!-- Decision -->
    <rect x="15" y="345" width="235" height="55" rx="6" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1" />
    <text x="25" y="367" font-family="sans-serif" font-size="11" font-weight="700" fill="#E11D48">Decision: Rejected</text>
    <text x="25" y="385" font-family="sans-serif" font-size="10" fill="#9F1239">Fails to show my real engineering work.</text>
  </g>

  <!-- ROAD 2: THE BALANCED -->
  <g transform="translate(335, 130)">
    <rect x="0" y="0" width="265" height="420" class="card-default" />
    <rect x="15" y="15" width="120" height="20" rx="4" fill="#F1F5F9" />
    <text x="22" y="29" class="road-tag" fill="#475569">ROAD 2: BALANCED</text>
    
    <text x="15" y="58" class="road-title">Vite + React 19 + TS (SPA)</text>
    <text x="15" y="74" class="text-body">Fast client-side single page app</text>

    <!-- Build -->
    <text x="15" y="105" class="text-label">How You Build:</text>
    <text x="15" y="122" class="text-body">• React 19 + Vite bundler</text>
    <text x="15" y="138" class="text-body">• Sub-50ms Hot Module Reload</text>

    <!-- Host -->
    <text x="15" y="168" class="text-label">Where You Host (Free):</text>
    <text x="15" y="185" class="text-body">• Netlify / Cloudflare Pages</text>

    <!-- Backend -->
    <text x="15" y="215" class="text-label">Backend Needed?</text>
    <text x="15" y="232" class="text-body">• Not yet. Client mock SSE stream.</text>

    <!-- Real Trade-off -->
    <text x="15" y="262" class="text-label">The Real Trade-off:</text>
    <text x="15" y="280" font-family="sans-serif" font-size="11" font-weight="600" fill="#D97706">▲ Context Switching</text>
    <text x="15" y="296" class="text-body">Great DX, but duplicates effort since Capstone is already built on Next.js 14.</text>

    <!-- Decision -->
    <rect x="15" y="345" width="235" height="55" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
    <text x="25" y="367" font-family="sans-serif" font-size="11" font-weight="700" fill="#B45309">Decision: Runner-Up</text>
    <text x="25" y="385" font-family="sans-serif" font-size="10" fill="#78350F">Strong alternative, but Next.js shares code.</text>
  </g>

  <!-- ROAD 3: THE MOST POWERFUL (WINNER) -->
  <g transform="translate(620, 130)">
    <rect x="0" y="0" width="270" height="420" class="card-selected" />
    <rect x="15" y="15" width="145" height="20" rx="4" fill="#ECFDF5" />
    <text x="22" y="29" class="road-tag" fill="#059669">ROAD 3: CHOSEN WINNER ★</text>
    
    <text x="15" y="58" class="road-title">Next.js 14 App Router + Vercel</text>
    <text x="15" y="74" class="text-body">Static-First Client Architecture</text>

    <!-- Build -->
    <text x="15" y="105" class="text-label">How You Build:</text>
    <text x="15" y="122" class="text-body">• Next.js 14 App Router + RSC</text>
    <text x="15" y="138" class="text-body">• Strict TypeScript &amp; Tailwind</text>

    <!-- Host -->
    <text x="15" y="168" class="text-label">Where You Host (Free):</text>
    <text x="15" y="185" class="text-body">• Vercel Hobby Tier (Edge CDN)</text>

    <!-- Backend -->
    <text x="15" y="215" class="text-label">Backend Needed?</text>
    <text x="15" y="232" class="text-winner">• "Not Yet" (Serverless API only)</text>

    <!-- Real Trade-off -->
    <text x="15" y="262" class="text-label">The Real Trade-off:</text>
    <text x="15" y="280" class="text-winner">✔ 100% Code &amp; Token Parity</text>
    <text x="15" y="296" class="text-body">Shares exact design tokens and components with SMX AI Capstone. Zero DB to manage.</text>

    <!-- Decision -->
    <rect x="15" y="345" width="240" height="55" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2" />
    <text x="25" y="367" font-family="sans-serif" font-size="11" font-weight="700" fill="#059669">Selected &amp; Already Live</text>
    <text x="25" y="385" font-family="sans-serif" font-size="10" fill="#047857">https://smxai-flyrank.vercel.app/</text>
  </g>
</svg>
